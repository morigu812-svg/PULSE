services:
  - type: web
    runtime: static
    name: pulse
    repo: https://github.com/morigu812-svg/PULSE
    branch: main
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
