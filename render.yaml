services:
  - type: web
    runtime: static
    name: pulse
    repo: https://github.com/morigu812-svg/PULSE
    branch: main
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /pulse-api/*
        destination: https://bskmgytpfhmjhrclcohf.supabase.co/*
    headers:
      - path: /pulse-api/*
        name: Cache-Control
        value: no-store, private
      - path: /pulse-api/*
        name: Vary
        value: x-pulse-session, apikey

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
