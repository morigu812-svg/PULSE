name: Check PULSE frontend
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - 'tests/**'
      - '.github/workflows/monitor.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check config.js
      - run: node --test tests/dashboard.test.cjs
